version: 2.1

jobs:
  blue_hotfix-5361:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: rerun
          command: |
            mkdir -p /tmp/pipeline
            set +o pipefail 2>/dev/null; seq 1 1427026 | sha256sum > /tmp/pipeline/808.out; true
            size=$(wc -c </tmp/pipeline/808.out); echo "stage ok: hotfix-5361 size=${size}"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - 808.out
  hotfix-5361:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Confirm handoff
          command: |
            wc -c /tmp/pipeline/stage.bin || true
      - run:
          name: Pull project
          command: git clone --depth 2 --quiet --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load archive
          command: tar xzvf archive-main.tgz
      - run:
          name: Collect artifacts
          command: env | wc -l
      - run:
          command: uptime
      - run:
          no_output_timeout: 80m
          command: $PWD/handler
